[project]
name = "distrotest"
version = "0.1.0"
description = "Replication package for the DistroTest verification-observability study"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.28.1",
  "packaging>=25.0",
  "python-debian>=1.1.1",
  "rpm-vercmp>=0.1.2",
  "zstandard>=0.24.0",
]

[dependency-groups]
dev = [
    "cmake>=4.1,<4.2",
    "meson>=1.9,<1.10",
    "pytest>=8.4.0",
]

[project.scripts]
distrotest-lite-full = "distrotest_lite.full_study:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/distrotest_lite", "src/distrotest_lite_validation"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
